
spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s

          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://127.0.0.1:8081}
              predicates:
                - Path=/api/auth/**

server:
  port: ${GATEWAY_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s

          routes:
            # Rate limits are per client (path + client IP, see
            # ClientAddressFilter), not shared by every user.

            # Login rate limiting
            - id: auth-login
              order: -10
              uri: ${AUTH_SERVICE_URL:http://127.0.0.1:8081}
              predicates:
                - Path=/api/auth/login
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@authClientKeyResolver}"
                    bucket4j-rate-limiter.capacity: ${AUTH_LOGIN_RATE_CAPACITY:10}
                    bucket4j-rate-limiter.refillTokens: ${AUTH_LOGIN_REFILL_TOKENS:10}
                    bucket4j-rate-limiter.refillPeriod: 1m
                    bucket4j-rate-limiter.requestedTokens: 1

            # Register rate limiting
            - id: auth-register
              order: -9
              uri: ${AUTH_SERVICE_URL:http://127.0.0.1:8081}
              predicates:
                - Path=/api/auth/register
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@authClientKeyResolver}"
                    bucket4j-rate-limiter.capacity: ${AUTH_REGISTER_RATE_CAPACITY:5}
                    bucket4j-rate-limiter.refillTokens: ${AUTH_REGISTER_REFILL_TOKENS:5}
                    bucket4j-rate-limiter.refillPeriod: 1m
                    bucket4j-rate-limiter.requestedTokens: 1

            # Refresh token rate limiting
            - id: auth-refresh
              order: -8
              uri: ${AUTH_SERVICE_URL:http://127.0.0.1:8081}
              predicates:
                - Path=/api/auth/refresh
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@authClientKeyResolver}"
                    bucket4j-rate-limiter.capacity: ${AUTH_REFRESH_RATE_CAPACITY:30}
                    bucket4j-rate-limiter.refillTokens: ${AUTH_REFRESH_REFILL_TOKENS:30}
                    bucket4j-rate-limiter.refillPeriod: 1m
                    bucket4j-rate-limiter.requestedTokens: 1

            # Existing fallback route
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://127.0.0.1:8081}
              predicates:
                - Path=/api/auth/**

            # Career service (P5). Access token verified by the gateway
            # first (SecurityConfig, chain 1), then again by the service.
            - id: career-service
              uri: ${CAREER_SERVICE_URL:http://127.0.0.1:8083}
              predicates:
                - Path=/api/career/**

server:
  port: ${GATEWAY_PORT:8080}

careertrack:
  gateway:
    # Shared secret the Next.js BFF sends with X-CareerTrack-Client-IP.
    # Empty disables the header (the client is then the last
    # X-Forwarded-For hop from Caddy, or the socket address).
    bff-key: ${GATEWAY_BFF_KEY:}
    rate-limit:
      max-buckets: ${GATEWAY_RATE_LIMIT_MAX_BUCKETS:50000}

  # ADR 0001, stage E: verification of access tokens on /api/career/**.
  access-token:
    jwk-set-uri: ${AUTH_JWKS_URI:http://127.0.0.1:8081/.well-known/jwks.json}
    issuer: careertrack-auth
    audience: careertrack-api

  # Auth's revocation snapshot (logout / logout-all), polled every 5 s.
  # Empty key disables polling (logged as a warning at startup).
  revocations:
    url: ${AUTH_REVOCATIONS_URL:http://127.0.0.1:8081/internal/revocations}
    internal-api-key: ${REVOCATIONS_INTERNAL_API_KEY:}
    poll-interval: ${REVOCATIONS_POLL_INTERVAL:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
